<div class="avisos" role="status" aria-live="polite">
  @for (aviso of avisos(); track aviso.id) {
    <article class="aviso" [class]="'tipo-' + aviso.tipo">
      <span class="icono" aria-hidden="true">
        @switch (aviso.tipo) {
          @case ('ok') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M8 12.4l2.6 2.6L16 9.6" />
            </svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7.5v5.5M12 16.4h.01" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5.5M12 7.6h.01" />
            </svg>
          }
        }
      </span>

      <p class="texto">{{ aviso.texto }}</p>

      <button type="button" class="cerrar" aria-label="Cerrar aviso" (click)="cerrar(aviso.id)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
        </svg>
      </button>
    </article>
  }
</div>
