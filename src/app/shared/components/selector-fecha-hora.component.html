<div class="selector">
  <span class="etiqueta">{{ etiqueta() }}</span>

  <div class="resumen" [class.sin-elegir]="!diaElegido()">
    <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="3" />
      <path d="M3 10h18M8 3v4M16 3v4" />
    </svg>
    <span class="detalle">{{ resumen() }}</span>
  </div>

  <div class="panel">
    <section class="calendario">
      <header class="cabecera">
        <button
          type="button"
          class="flecha"
          aria-label="Mes anterior"
          [disabled]="!puedeRetroceder()"
          (click)="mesAnterior()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 6l-6 6 6 6" />
          </svg>
        </button>

        <div class="titulo">
          <span class="mes">{{ meses[mesVisible()] }}</span>
          <span class="anio">{{ anioVisible() }}</span>
        </div>

        <button type="button" class="hoy" (click)="irAHoy()">Hoy</button>

        <button type="button" class="flecha" aria-label="Mes siguiente" (click)="mesSiguiente()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 6l6 6-6 6" />
          </svg>
        </button>
      </header>

      <div class="semana">
        @for (inicial of diasCortos; track $index) {
          <span>{{ inicial }}</span>
        }
      </div>

      <div class="dias">
        @for (celda of celdas(); track celda.clave) {
          <button
            type="button"
            class="dia"
            [class.fuera]="!celda.delMes"
            [class.hoy]="celda.hoy"
            [class.elegido]="celda.clave === diaElegido()"
            [disabled]="celda.deshabilitado"
            (click)="elegirDia(celda)">
            {{ celda.dia }}
          </button>
        }
      </div>
    </section>

    <section class="tiempo">
      <div class="bloque">
        <span class="rotulo">Hora</span>
        <div class="grilla horas">
          @for (hora of horas; track hora) {
            <button
              type="button"
              class="ficha"
              [class.elegido]="hora === horaElegida() && !!diaElegido()"
              [disabled]="horaDeshabilitada(hora)"
              (click)="elegirHora(hora)">
              {{ dosDigitos(hora) }}
            </button>
          }
        </div>
      </div>

      <div class="bloque">
        <span class="rotulo">Minutos</span>
        <div class="grilla">
          @for (minuto of minutos; track minuto) {
            <button
              type="button"
              class="ficha"
              [class.elegido]="minuto === minutoElegido() && !!diaElegido()"
              [disabled]="minutoDeshabilitado(minuto)"
              (click)="elegirMinuto(minuto)">
              {{ dosDigitos(minuto) }}
            </button>
          }
        </div>
      </div>
    </section>
  </div>
</div>
