<div class="panel">
  <aside class="lateral">
    <a class="marca" routerLink="/admin" aria-label="CineNova, panel de administración">
      <svg viewBox="0 0 36 36" width="30" height="30" aria-hidden="true">
        <defs>
          <linearGradient id="gradMarcaAdmin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffd27f" />
            <stop offset="100%" stop-color="#f5b43c" />
          </linearGradient>
        </defs>
        <rect x="2.5" y="6" width="31" height="24" rx="7" fill="none" stroke="url(#gradMarcaAdmin)" stroke-width="2" />
        <circle cx="8" cy="11" r="1.4" fill="url(#gradMarcaAdmin)" />
        <circle cx="8" cy="25" r="1.4" fill="url(#gradMarcaAdmin)" />
        <circle cx="28" cy="11" r="1.4" fill="url(#gradMarcaAdmin)" />
        <circle cx="28" cy="25" r="1.4" fill="url(#gradMarcaAdmin)" />
        <path d="M15.2 12.9 L24 18 L15.2 23.1 Z" fill="url(#gradMarcaAdmin)" />
      </svg>
      <span class="marca-texto">
        <span class="marca-nombre">Cine<strong>Nova</strong></span>
        <span class="marca-rol">Administración</span>
      </span>
    </a>

    <nav class="nav" aria-label="Navegación de administración">
      <a class="nav-item" routerLink="/admin" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
        <span>Panel</span>
      </a>

      <a class="nav-item" routerLink="/admin/peliculas" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M7 5v14M17 5v14" stroke="currentColor" stroke-width="1.5" opacity=".55" />
          <path d="M2.5 12h19" stroke="currentColor" stroke-width="1.5" opacity=".55" />
        </svg>
        <span>Películas</span>
      </a>

      <a class="nav-item" routerLink="/admin/funciones" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>Funciones</span>
      </a>

      <a class="nav-item" routerLink="/admin/salas" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M3 4h18v9H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M5 17h3v3H5zM10.5 17h3v3h-3zM16 17h3v3h-3z" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span>Salas</span>
      </a>

      <a class="nav-item" routerLink="/admin/candy" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 9h12l-1.3 11.2a1.6 1.6 0 0 1-1.6 1.4H8.9a1.6 1.6 0 0 1-1.6-1.4Z"
                fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
          <path d="M9 9V6.4A3 3 0 0 1 15 6.4V9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>Candy bar</span>
      </a>

      <a class="nav-item" routerLink="/admin/promociones" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3.2 14.5 9l6.3.5-4.8 4.1 1.5 6.2L12 16.6 6.5 19.8 8 13.6 3.2 9.5 9.5 9Z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
        <span>Promociones</span>
      </a>

      <a class="nav-item" routerLink="/admin/usuarios" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="9.5" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M3 20c.6-3.6 3.3-5.6 6.5-5.6s5.9 2 6.5 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M17 6.2a3.3 3.3 0 0 1 0 6M18.5 14.9c1.6.8 2.7 2.5 3 5.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <span>Usuarios</span>
      </a>

      <a class="nav-item" routerLink="/admin/reportes" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        <span>Reportes</span>
      </a>

      <a class="nav-item" routerLink="/admin/log" routerLinkActive="activo">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M12 7.2V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Actividad</span>
      </a>
    </nav>

    <div class="pie-lateral">
      <div class="usuario">
        <span class="avatar">{{ inicial() }}</span>
        <span class="usuario-datos">
          <span class="usuario-nombre">{{ auth.nombreCompleto() }}</span>
          <span class="usuario-email">{{ email() }}</span>
        </span>
      </div>

      <a class="accion" routerLink="/">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M5.8 10.2V20h12.4v-9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Volver al sitio</span>
      </a>

      <button type="button" class="accion peligro" (click)="salir()">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M14.5 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          <path d="M16 8.5 19.5 12 16 15.5M19.5 12H10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <main class="contenido">
    <router-outlet />
  </main>
</div>

<app-avisos />
